name: Database Performance Simulation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'infra/Dockerfile'
      - 'requirements.txt'
      - 'src/**'
      - 'infra/scripts/**'
      - '.github/workflows/image-build.yml'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duração do teste em segundos'
        required: true
        default: '120'
      stress_level:
        description: 'Nível de estresse (número de workers paralelos)'
        required: true
        default: '5'

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            docker:
              - 'infra/Dockerfile'
              - 'requirements.txt'
              - 'src/**'
              - 'infra/scripts/**'
              - '.github/workflows/image-build.yml'

  build-image:
    needs: check-changes
    if: needs.check-changes.outputs.docker == 'true'
    uses: ./.github/workflows/image-build.yml

  run-perf-test:
    needs: [check-changes, build-image]
    if: always() && (needs.check-changes.result == 'success') && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and Run DB Simulation
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"
          docker pull $IMAGE_NAME
          
          # Passa o nível de estresse via variável de ambiente
          STRESS=${{ github.event.inputs.stress_level || '5' }}
          docker run -d --name db-node -p 5000:5000 -e STRESS_LEVEL=$STRESS $IMAGE_NAME
          
          DURATION=${{ github.event.inputs.duration || '120' }}
          echo "🚀 Monitorando atividade por $DURATION segundos..."
          INTERVAL=10
          ELAPSED=0
          
          while [ $ELAPSED -lt $DURATION ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            
            # Coleta métricas rápidas para o log
            BLOCKS=$(docker exec db-node curl -s http://localhost:5000/api/blocks | jq '. | length' 2>/dev/null || echo "0")
            TXS=$(docker exec db-node curl -s http://localhost:5000/api/blocks | jq '[.[].transactions | length] | add' 2>/dev/null || echo "0")
            
            echo "⏱️  ${ELAPSED}s / ${DURATION}s | 📦 Blocos: $BLOCKS | 📝 Transações: $TXS"
          done
          
          echo "✅ Tempo de simulação atingido!"
          
          # Captura dados avançados
          TOTAL_BLOCKS=$(docker exec db-node curl -s http://localhost:5000/api/blocks | jq '. | length')
          TOTAL_DATA=$(docker exec db-node curl -s http://localhost:5000/api/blocks | jq '[.[].transactions | length] | add')
          TOTAL_NODES=$(docker exec db-node curl -s http://localhost:5000/api/balances | jq 'keys | length')
          THROUGHPUT=$(echo "scale=2; $TOTAL_DATA / $DURATION" | bc)
          
          # Gerando Sumário Bonito
          echo "## 📊 Database Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚙️ Test Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔥 Stress Level | $STRESS |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Image | \`$IMAGE_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📈 Results" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 Total Transactions | **$TOTAL_DATA** |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ Throughput | **$THROUGHPUT tx/s** |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Ledger Height | **$TOTAL_BLOCKS** blocks |" >> $GITHUB_STEP_SUMMARY
          echo "| 👥 Active Wallets | **$TOTAL_NODES** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🧪 Health Check" >> $GITHUB_STEP_SUMMARY
          if [ "$TOTAL_DATA" -gt 0 ]; then
            echo "✅ **Success:** Transactions processed correctly." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Failure:** No transactions recorded during the test." >> $GITHUB_STEP_SUMMARY
          fi
          
          docker stop db-node
