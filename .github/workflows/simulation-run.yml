name: Blockchain Simulation Run

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duração da simulação em segundos'
        required: true
        default: '300'

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build local image (for testing runner)
        run: docker build -t mini-blockchain:test .

      - name: Run Blockchain and Simulator
        run: |
          echo "🚀 Iniciando Blockchain por ${{ github.event.inputs.duration }} segundos..."
          # Roda o container em background
          docker run -d --name bc-node -p 5000:5000 mini-blockchain:test
          
          # Espera a duração informada
          sleep ${{ github.event.inputs.duration }}
          
          echo "📊 Resultados da Simulação:"
          echo "--------------------------"
          echo "Blocos Minerados:"
          docker exec bc-node curl -s http://localhost:5000/api/blocks | jq '. | length'
          
          echo "Estado Final dos Contratos:"
          docker exec bc-node curl -s http://localhost:5000/api/state | jq .
          
          echo "Logs do Sistema:"
          docker logs bc-node
          
          docker stop bc-node
