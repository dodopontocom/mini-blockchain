<!DOCTYPE html>
<html>
<head>
    <title>Carteira Blockchain</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .wallet-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 10px;
            background-color: #f8f9fa;
        }
        .card-header-custom {
            background-color: #007bff;
            color: white;
            border-radius: 8px 8px 0 0;
        }
        .transaction-form {
            margin-top: 2rem;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
        }
        .copy-button {
            border-radius: 0 5px 5px 0;
        }
        .balance-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wallet-container">
            <!-- Cabeçalho com informações do usuário -->
            <div class="card mb-4">
                <div class="card-header card-header-custom">
                    <h2 class="mb-0">👤 Carteira de {{ session.user.name }}</h2>
                </div>
                <div class="card-body">
                    <div class="row">
                        <!-- Coluna de Informações -->
                        <div class="col-md-6">
                            <h5 class="card-title">🔑 Informações</h5>
                            <div class="mb-3">
                                <label class="form-label">Endereço:</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" 
                                        value="{{ session.user.address }}" readonly
                                        id="address-field">
                                    <button class="btn btn-outline-secondary copy-button"
                                        onclick="copiarEndereco()">
                                        📋 Copiar
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Coluna de Saldo -->
                        <div class="col-md-6">
                            <h5 class="card-title">💰 Saldo</h5>
                            <div class="d-flex align-items-center">
                                <span class="balance-display" id="balance-display">
                                    ⌛ Carregando...
                                </span>
                                <button class="btn btn-link" onclick="atualizarSaldo()">
                                    🔄
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulário de Transação -->
            <div class="card transaction-form">
                <div class="card-body">
                    <h5 class="card-title mb-4">💸 Enviar Transação</h5>
                    <form onsubmit="enviarTransacao(event)" id="transaction-form">
                        <div class="mb-3">
                            <label class="form-label">📥 Destinatário</label>
                            <input type="text" class="form-control" 
                                placeholder="Insira o endereço do destinatário"
                                id="receiver-field" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">💵 Quantidade (BTC)</label>
                            <div class="input-group">
                                <input type="number" step="0.01" class="form-control"
                                    placeholder="0.00"
                                    id="amount-field" required
                                    min="0.01" max="1000">
                                <span class="input-group-text">BTC</span>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                🚀 Enviar Transação
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Função para copiar endereço
        function copiarEndereco() {
            const campoEndereco = document.getElementById('address-field');
            navigator.clipboard.writeText(campoEndereco.value);
            alert('Endereço copiado!');
        }

        // Função para atualizar saldo
        async function atualizarSaldo() {
            try {
                const response = await fetch('/api/balances');
                const balances = await response.json();
                const saldo = balances['{{ session.user.address }}'] || 100.00;
                
                document.getElementById('balance-display').innerHTML = `
                    ${saldo.toFixed(2)} BTC
                `;
            } catch (error) {
                alert('Erro ao atualizar saldo: ' + error.message);
            }
        }

        // Função para enviar transação
        async function enviarTransacao(event) {
            event.preventDefault();
            
            const receiver = document.getElementById('receiver-field').value.trim();
            const amount = parseFloat(document.getElementById('amount-field').value);

            try {
                // Validação básica no cliente
                if (!receiver || !amount || amount <= 0) {
                    throw new Error('Preencha todos os campos corretamente');
                }

                const response = await fetch('/enviar-transacao', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        receiver: receiver,
                        amount: amount
                    })
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('✅ Transação enviada com sucesso!');
                    document.getElementById('transaction-form').reset();
                    atualizarSaldo();
                } else {
                    throw new Error(result.message || 'Erro desconhecido');
                }
            } catch (error) {
                alert(`❌ Erro: ${error.message}`);
                console.error('Erro detalhado:', error);
            }
        }

        // Atualiza saldo ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            atualizarSaldo();
        });
    </script>
</body>
</html>
