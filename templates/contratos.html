{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2 class="display-6">🚀 Smart Contracts Explorer</h2>
        <p class="text-muted">Inspecione o código e o estado global de todos os contratos ativos na rede.</p>
    </div>
    <div class="col-auto">
        <button class="btn btn-outline-primary" onclick="loadContracts()">🔄 Atualizar</button>
    </div>
</div>

<div id="contracts-container" class="row g-4">
    <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2">Carregando contratos...</p>
    </div>
</div>

<script>
async function loadContracts() {
    const container = document.getElementById('contracts-container');
    try {
        const response = await fetch('/api/contracts');
        const data = await response.json();
        
        const contractAddrs = Object.keys(data.contracts);
        
        if (contractAddrs.length === 0) {
            container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="alert alert-info">Nenhum contrato encontrado na rede.</div>
                </div>`;
            return;
        }

        container.innerHTML = contractAddrs.map(addr => {
            const code = data.contracts[addr];
            const state = data.states[addr] || {};
            
            return `
                <div class="col-md-6 col-lg-4">
                    <div class="card shadow-sm h-100 border-0">
                        <div class="card-header bg-primary text-white font-monospace small py-2">
                            ADDR: ${addr}
                        </div>
                        <div class="card-body">
                            <h6 class="card-title fw-bold"><i class="bi bi-code-square"></i> Código-Fonte</h6>
                            <pre class="bg-light p-2 rounded small" style="max-height: 150px; overflow-y: auto;"><code>${escapeHtml(code)}</code></pre>
                            
                            <h6 class="card-title fw-bold mt-4"><i class="bi bi-database"></i> Estado Atual (Storage)</h6>
                            <div class="bg-dark text-success p-2 rounded small font-monospace">
                                <pre class="mb-0"><code>${JSON.stringify(state, null, 2)}</code></pre>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-0 text-end pb-3">
                            <span class="badge bg-light text-dark border">Contrato Ativo</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

    } catch (error) {
        console.error('Erro ao carregar contratos:', error);
        container.innerHTML = `<div class="alert alert-danger">Erro ao conectar com o servidor.</div>`;
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Carregar ao iniciar
document.addEventListener('DOMContentLoaded', loadContracts);
// Auto-update a cada 15 segundos (junto com o intervalo de mineração)
setInterval(loadContracts, 15000);
</script>

<style>
    pre { margin-bottom: 0; }
    .card { transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
</style>
{% endblock %}
